services:
  postgres:
    image: postgres:17-alpine
    container_name: jalikud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jalikud}
      POSTGRES_USER: ${POSTGRES_USER:-jalikud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalikud -d jalikud"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: ghcr.io/jiwonieee19/jalikud-api:latest
    container_name: jalikud-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_KEY=${APP_KEY:?Set APP_KEY in the root .env}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-jalikud}
      - DB_USERNAME=${POSTGRES_USER:-jalikud}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ghcr.io/jiwonieee19/jalikud-web:latest
    container_name: jalikud-web
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
