services:
  postgres:
    image: postgres:17-alpine
    container_name: jalikud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jalikud}
      POSTGRES_USER: ${POSTGRES_USER:-jalikud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalikud -d jalikud"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jalikud
    restart: unless-stopped

  backend:
    build: ./backend
    image: ghcr.io/jiwonieee19/jalikud-api:latest
    container_name: jalikud-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_KEY=${APP_KEY:?Set APP_KEY in the root .env}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-jalikud}
      - DB_USERNAME=${POSTGRES_USER:-jalikud}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      # Trust X-Forwarded-* from the nginx proxy ONLY (its pinned IP below).
      # This makes rate-limit buckets key on the real client IP instead of the
      # proxy IP; without it every proxied request shares ONE bucket and a
      # single client can 429 every other user. Trusting the whole compose
      # subnet instead would re-trust the clients and collapse the buckets
      # again, so this must be the proxy address specifically.
      # See bootstrap/app.php.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.30.0.20}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    networks:
      jalikud:
        ipv4_address: ${BACKEND_IP:-172.30.0.10}
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ghcr.io/jiwonieee19/jalikud-web:latest
    container_name: jalikud-web
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      jalikud:
        ipv4_address: ${FRONTEND_IP:-172.30.0.20}
    restart: unless-stopped

networks:
  jalikud:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so the nginx container keeps a stable address, which is
        # what TRUSTED_PROXIES must point at (a CIDR covering the whole subnet
        # would also trust the clients and collapse every rate-limit bucket).
        - subnet: ${SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
