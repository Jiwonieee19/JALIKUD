name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/jiwonieee19/jalikud-api
  WEB_IMAGE: ghcr.io/jiwonieee19/jalikud-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Write deployment summary
        run: |
          {
            echo "## Deploy complete 🚀"
            echo ""
            echo "| Image | Tag |"
            echo "|-------|-----|"
            echo "| \`${{ env.API_IMAGE }}\` | \`latest\`, \`${GITHUB_SHA::7}\` |"
            echo "| \`${{ env.WEB_IMAGE }}\` | \`latest\`, \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "Pull locally with: **./deploy.ps1**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploys onto the local machine. Requires a registered self-hosted
  # runner (repo Settings > Actions > Runners) with Docker installed.
  deploy-local:
    runs-on: [self-hosted]
    needs: build-and-push
    steps:
      - name: Checkout repository (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Log in to GHCR
        shell: pwsh
        run: |
          '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u Jiwonieee19 --password-stdin

      - name: Pull and restart stack
        shell: pwsh
        run: |
          docker compose pull backend frontend
          docker compose up -d --no-build backend frontend
          docker image prune -f

      - name: Log out of GHCR
        if: always()
        shell: pwsh
        run: docker logout ghcr.io
