# Fall back to the real connection scheme when no upstream tunnel sent
# X-Forwarded-Proto (e.g. someone hitting http://localhost:5173 directly).
# Defined at http level, so it must sit outside the server block below.
map $http_x_forwarded_proto $forwarded_proto {
    default   $http_x_forwarded_proto;
    ""        $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA and any uploaded images can exceed nginx's 1 MB default. Keep this
    # in sync with the validation limits in the backend Upload*Request classes.
    client_max_body_size 10m;

    # Chat streaming endpoint — disable proxy buffering so Server-Sent Events
    # are delivered token-by-token instead of being held until the reply ends.
    location /api/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy API calls to the Laravel backend container
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme from an upstream tunnel (ngrok/cloudflared) instead
        # of always reporting $scheme. Without this Laravel believes a request
        # that arrived over https is plaintext, which breaks generated URLs and
        # any future signed-URL/HTTPS enforcement.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve uploaded files (storage/app/public) through the backend container.
    location /storage {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Menu artwork lives in backend/public/images/menu and is served from there,
    # not from this container. The mobile app resolves a stored `image_url`
    # against the API origin (see mobile/src/lib/api.ts assetUrl), so the files
    # must exist on the backend to be reachable at all; proxying the same path
    # here keeps one copy instead of shipping a duplicate into the web image.
    #
    # Scoped to /images/menu deliberately: /images/logo-mark.png belongs to this
    # app (see src/components/ui/Logo.tsx) and must keep resolving against the
    # web root, which `location /` below already handles.
    location /images/menu {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache hashed static assets aggressively
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
